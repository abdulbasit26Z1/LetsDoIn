<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ukGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ukGradient)" filter="url(#shadow)"/>

  <!-- Subtle Union Jack Overlay Pattern -->
  <path d="M 32 32 L 480 480 M 480 32 L 32 480 M 256 32 L 256 480 M 32 256 L 480 256" stroke="#ffffff" stroke-opacity="0.15" stroke-width="24" stroke-linecap="round"/>

  <!-- White UK Emblem Text -->
  <text x="256" y="325" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="220" fill="#ffffff" text-anchor="middle" letter-spacing="-6">UK</text>
</svg>
