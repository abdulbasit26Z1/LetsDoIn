    <!-- Initialize the tree when page is loaded -->
    
    <script>

var charts = new Array();

function initChart() {

        console.log("initChart");
        Highcharts.setOptions({
            global: {
                useUTC: true
            }
        });
        

}



function addChart(level, title)
{
    var chartName = "chart"+level;
    
    console.log("adding chart: " + chartName);
    
    if(  $('#'+chartName).length <= 0 )
        $("#chart").append('<div id="'+chartName+'" style="height: 400px; min-width: 310px"></div>');
    
    // Create the chart
    $('#'+chartName).highcharts('StockChart', {
        chart: {
            type: 'spline',
            events: {
                load: function() {
                }
            }
        },
        credits: {
            enabled: false
        },
       
        rangeSelector : {
            buttons: [{
                type: 'minute',
                count: 1,
                text: '1m'
            },{
                type: 'hour',
                count: 1,
                text: '1h'
            },{
                type: 'hour',
                count: 6,
                text: '6h'
            },{
                type: 'day',
                count: 1,
                text: '1d'
            }],
            inputEnabled: false, // it supports only days
            selected : 0// all
        },       
       
       
        title: {
            text: title
        },

        exporting: {
            enabled: false
        },

        tooltip: {
            enabled: true
        },
        
        legend: {
            enabled: true,
            //layout: 'vertical',
            align: 'center',
            verticalAlign: 'bottom'
        },
    });    

    charts[level] = $('#'+chartName).highcharts();
}

var colors = new Array();
colors["parent"] = "gray";
colors["current"] = "green";
colors["transference"] = "blue";
colors["keyframes"] = "black";
colors["things"] = "orange";

function getRandomColor() {
    var letters = '0123456789ABCDEF'.split('');
    var color = '#';
    for (var i = 0; i < 6; i++ ) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

var previousDataFromEnv = "";
function addDataPoint(level, env, seriesName, time, value)
{
    level = "single_chart"; // if the level is not static, then it'll keep adding new charts
    if ( typeof(charts[level]) == "undefined" || previousDataFromEnv != env)
        addChart(level, env);
        
    var chart = charts[level];
    
    var series = null;
    for(var i=0; i<chart.series.length; i++)
    {
        if ( chart.series[i].name == seriesName )
        {
            series = chart.series[i];
            break;
        }
    }
    
    var color = getRandomColor();
    if ( typeof (colors[seriesName]) != "undefined" )
        color = colors[seriesName];
        
    if ( series == null){
        series = chart.addSeries({
            name: seriesName,
            color: color,
            data: null
        });
    }
    
//    var shift = series.data.length > 20;
    var shift = false;   
    
    if ( previousDataFromEnv != env ){
        chart.setTitle({text:env});
        series.data = null;
    }
        
    
    
    series.addPoint([Number(time), Number(value)], true, false);
    previousDataFromEnv = env;
}



    
    
    </script>
  <script type="text/javascript">

      
      
    var loopID = null;

    $(function() {
      console.time('jquery on ready');
      initChart();
      init();
      $("#tabs").tabs({
          heightStyle: 'content',
  
          activate: editTabsChanged,


      });

      console.timeEnd('jquery on ready');
    });

    function init() {
        console.time('initEngine()');
        initEngine();
        console.timeEnd('initEngine()');

        constructLocation();

        setTimeout(initEditMode, 100);

        startLoop();

        if (gEnvironment.isTimeRunning()) {
          $("#toggle_time").html("Pause");
        }
        else {
          $("#toggle_time").html("Start");
        }

        initButtonHandlers();


        showHideDebug();

    }
    
    function initEditMode()
    {
        console.time('constructEdit()');

        // constructTree(); //do this on click on advanced now
        constructSimulationSettings();
        constructTimeLine();
        constructKeyframes();
        constructNotes();
        constructAddCustomEnvironmentDialog();
        console.timeEnd('constructEdit()');
    }
      
     
      
      
    
    function showHideDebug()
    {
        $(".debug").each(function(index)
        {
            if ( debugMode )
                $(this).show();
            else
                $(this).hide();  
        });
    }
      
    function startLoop()
    {
        if ( loopID == null )
            loopID = setInterval(loop, 1000);
    }
      
    function stopLoop()
    {
        clearInterval(loopID);
        loopID = null;
    }
      
      
    function loop()
    {


        
        constructTimeDisplay();
        displayValues();
        
        if ( debugMode )
        {
            showKeyTimeInfo();
            displayNextKeyValues();
        }

    }
      
    function showKeyTimeInfo()
    {
        $("currentKeyTime").html(getTimeAsHHMMSS(gEnvironment.getCurrentKeyTime()));
        $("nextKeyTime").html(getTimeAsHHMMSS(gEnvironment.getNextKeyTime()));
    }


    function updateGraph(env, message) {
        var data = message.split(",");
        var level = data[0];
        var series = data[1];
        var time = data[2]*1000; // convert to ms
        var value = data[3];
        addDataPoint(level, env, series, time, value);        
    }



    var debugMode = false;


    

    

        
      
      
  </script>
