<script>
var ToggleSwitchUI = ToggleSwitchUI || ComponentUI.extend({
	init: function() {
		this._super.apply(this, arguments);
		
		var self = this;
		this.ui.find('.toggleBtn').click(function() { self.toggle(); });
	},
	update: function() {
		var state = this.eng.getState();
		
		if (state) {
			this.ui.find('.onImage').css('display', 'inline');
			this.ui.find('.offImage').css('display', 'none');
		} else {
			this.ui.find('.onImage').css('display', 'none');
			this.ui.find('.offImage').css('display', 'inline');
		}
	},
	toggle: function() {
		this.eng.toggleState();
	}
});

</script>

<img class='onImage' src='components/images/toggle_switch_on.png'/>
<img class='offImage' src='components/images/toggle_switch_off.png' />
<button class='toggleBtn' style='float:left; margin-top:-87px; margin-left:8px; width:48px; height:76px; opacity:0.0;'></button>
